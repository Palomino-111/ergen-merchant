# Supabase 项目配置。
#
# supabase/functions/ 是边缘函数源码的唯一真源。此前 11 个函数只存在于云端
# （entrypoint 指向 /tmp/user_fn_...），没有任何版本控制；本目录用于改变这一点。

project_id = "wmioylfpdbdwnbybkpju"

[functions.dispatch-delivery-order]
# 由商家端调用（备餐完成 → 呼叫骑手）。函数内转发用户 JWT，靠 RLS 鉴权，
# 并显式校验 merchant.user_id === auth.uid()。
verify_jwt = true

[functions.cancel-delivery-order]
# 由商家端调用（订单需要取消配送时）。与 dispatch-delivery-order 同一套鉴权：
# 转发用户 JWT 走 RLS，并显式校验 merchant.user_id === auth.uid()。
#
# ⚠️ 取消**可能产生费用**（快递100 文档第 3 节），返回的 cancelFee 落 cancel_fee 列。
# 远端 method=cancel。注意：**仓库源码里硬编码的是测试网关**
# （http://e-test.kuaidilab.com/api/bsamecity/order），与线上部署一致；
# 正式地址 https://api.kuaidi100.com/bsamecity/order 见函数注释。改地址前先确认环境。
#
# ⛔ 部署顺序：本函数写 cancel_fee / cancel_reason 两列，必须**先**跑迁移
#    20260924100000_add_cancel_fields.sql 再部署函数。
#    PostgREST 遇到未知列会整条 update 拒绝（PGRST204），不会部分应用 ——
#    迁移没跑就部署，快递100 侧取消成功（可能已扣费）而本地状态一个字都写不进去，
#    函数每次都返回 500「取消已成功但本地落库失败」，且幂等判断依赖的
#    status='cancelled' 永远写不出来，重试永远不收敛。
verify_jwt = true

[functions.get-courier-position]
# 由商家端调用（在途订单看骑手位置）。同样转发用户 JWT + 显式校验商家归属。
#
# ⚠️ 该接口在快递100 侧**计费**（文档 6.6 的 30004 处理方式写着「账号无可用余额，需要充值」），
# 因此函数不做任何轮询/重试，也刻意没做成客户端可直连的读接口。
# 远端 method=queryCourier。地址同 cancel-delivery-order：源码里是测试网关。
verify_jwt = true

[functions.delivery-order-callback]
# 由快递100 服务器回调（订单状态变更推送），**不带** Supabase JWT。
# verify_jwt = true 会让请求在函数入口被直接拒绝，回调永远进不来，
# 因此必须为 false，改用快递100 的 sign = MD5(param + salt) 自校验。
#
# 线上 slug 是 delivery-order-callback（首次部署时曾被自动生成成 clever-responder，
# 重新部署后才对上）。URL = https://<ref>.supabase.co/functions/v1/delivery-order-callback
#
# 本函数做两件事，职责分开：
#   1. 应用状态 → 验签通过才更新 meal_delivery_order
#   2. 审计留档 → **无论验签是否通过**都往 delivery_callback_event 落一行
#      （约定见迁移 20260922170000 第 4 节：sign_verified=false 不得用于更新配送单；
#        applied=false 可用于重放；raw_param 存原始报文以便事后重算签名）
#   审计写入失败不改变响应，只记 error 日志 —— 否则会把审计故障放大成
#   快递100 的 3 次重试投递。
verify_jwt = false

# ✅ callbackUrl 长度限制：实测**并不存在**，别再为 50 字符做妥协
#    文档写「长度最大50」，但 2026-09-24 直连测试环境逐个长度实测，全部返回 code 200：
#      不带 / 50 / 70 / 88 / 255 字符  →  均下单成功
#    复现脚本：scripts/test-callback-url-limit.ps1
#    注意复现时 price 必须 > 0，否则会先被 30005「物品总金额必须大于0」挡下，
#    根本走不到 callbackUrl 校验，得到的是假阴性（这个坑踩过一次）。
#
#    → 结论：直接用下面这个 70 字符的 URL 即可，无需短域名、无需跳板。
#      DELIVERY_CALLBACK_URL =
#        https://wmioylfpdbdwnbybkpju.supabase.co/functions/v1/clever-responder
#      （70 字符 = 前缀 54 + slug "clever-responder" 16）
#
#    ⚠️ 线上部署时 slug 是自动生成的（名为 delivery-order-callback，slug 为
#       clever-responder），与项目里其他函数同一风格（如 rapid-endpoint）。
#       改 URL 前先用 supabase functions list 核对当前 slug，别照抄上面的值。
#
#    （历史备注）Supabase 网关只按第一段路径路由，其后的路径段会被原样透传：
#      /functions/v1/HelloWorld/delivery-order-callback -> 200（仍进 HelloWorld）
#      /functions/v1/delivery-order-callback/x          -> 404
#      既然长度不受限，这个跳板技巧已无必要，仅作记录。

# ⚠️ 部署回调函数时必须 verify_jwt = false（2026-09-24 实测踩到）：
#    首次部署用的是 verify_jwt = true，结果快递100 的回调在网关层就被挡掉：
#      POST /functions/v1/clever-responder  （无 Authorization）
#        -> 401 {"code":"UNAUTHORIZED_NO_AUTH_HEADER","message":"Missing authorization header"}
#    带上 JWT 再打同一个请求则返回 200 {"result":true,"returnCode":"200"}，
#    说明函数本身没问题，纯粹是入口的 JWT 校验把回调拒了。
#    改 false 后，鉴权完全依赖函数内的 MD5(param + salt) 验签（错签名实测返回 401 验签失败）。
