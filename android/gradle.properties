org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# 走阿里云 / 国内镜像直连，无需代理；如需走本地代理（Clash/V2Ray 等，端口 7890）再把下面四行取消注释
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
# 关闭 R8 代码/资源压缩。原因：AGP 8.3.1 自带的 R8 只支持到 Kotlin metadata 2.0.0，
# 而依赖(okhttp 5.2.1 / kotlin-stdlib 2.2.20 / kotlinx-coroutines 1.10.2 等)已是 2.1.0~2.2.0，
# 会导致 :app:minifyReleaseWithR8 抛 "Provided Metadata instance has version 2.2.0, while
# maximum supported version is 2.0.0" 而打包失败。该属性由 Flutter 插件读取(flutter.groovy
# 的 shouldShrinkResources)。代价：APK 体积略大、不做混淆。
shrink=false
