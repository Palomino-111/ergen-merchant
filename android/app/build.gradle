plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.zheergen.zheergen_merchant_end"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.zheergen.zheergen_merchant_end"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        zheergenMerchantEndDebug {
            storeFile file('zheergenMerchantEndKeystore')
            storePassword 'zheergenMerchantEndKeystore2025'
            keyAlias 'zheergenMerchantEndDebug'
            keyPassword 'zheergenMerchantEndDebug2025'
        }
        zheergenMerchantEndRelease {
            storeFile file('zheergenMerchantEndKeystore')
            storePassword 'zheergenMerchantEndKeystore2025'
            keyAlias 'zheergenMerchantEndRelease'
            keyPassword 'zheergenMerchantEndRelease2025'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.zheergenMerchantEndRelease
        }
        release {
            signingConfig signingConfigs.zheergenMerchantEndRelease
        }
    }
}

flutter {
    source = "../.."
}
