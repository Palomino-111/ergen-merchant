plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.zheergen.zheergen_merchant_end"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.zheergen.zheergen_merchant_end"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // TPNS 凭据注入：AndroidManifest 里用 ${XG_ACCESS_ID} / ${XG_ACCESS_KEY} 引用。
        // 为什么放 defaultConfig 而不是 buildTypes：debug 和 release 都用同一套凭据，
        // 放这里两个 buildType 都会继承，不用重复写。
        // 注意：这里只放客户端凭据（AccessID/AccessKey），SecretKey 只用于服务端 REST API，
        // 绝不要写进客户端代码或 manifest，否则会被反编译泄露。
        manifestPlaceholders["XG_ACCESS_ID"] = "1500047086"
        manifestPlaceholders["XG_ACCESS_KEY"] = "A77TME78I79A"
    }

    signingConfigs {
        zheergenMerchantEndDebug {
            storeFile file('zheergenMerchantEndKeystore')
            storePassword 'zheergenMerchantEndKeystore2025'
            keyAlias 'zheergenMerchantEndDebug'
            keyPassword 'zheergenMerchantEndDebug2025'
        }
        zheergenMerchantEndRelease {
            storeFile file('zheergenMerchantEndKeystore')
            storePassword 'zheergenMerchantEndKeystore2025'
            keyAlias 'zheergenMerchantEndRelease'
            keyPassword 'zheergenMerchantEndRelease2025'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.zheergenMerchantEndRelease
        }
        release {
            signingConfig signingConfigs.zheergenMerchantEndRelease
        }
    }
}

flutter {
    source = "../.."
}
